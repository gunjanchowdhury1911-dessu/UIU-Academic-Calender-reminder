<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UIU Academic Reminders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fa; --card:#ffffff; --ink:#13203a; --muted:#5d6b82; --line:#dde4ee;
  --fee:#b45309; --exam:#6d28d9; --deadline:#be123c; --class:#0369a1; --holiday:#15803d;
  --hero:#13203a; --hero-ink:#ffffff;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1424; --card:#14203a; --ink:#e8eef9; --muted:#93a3bf; --line:#24334f;
    --fee:#fbbf24; --exam:#a78bfa; --deadline:#fb7185; --class:#38bdf8; --holiday:#4ade80;
    --hero:#1d2f57; --hero-ink:#ffffff;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--body);padding:0 0 48px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:22px 0 6px}
header h1{font:800 22px/1.1 var(--head);margin:0}
header p{margin:4px 0 0;color:var(--muted);font-size:15px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:22px 20px 20px;margin:14px 0 8px}
.hero small{display:block;font-size:15px;opacity:.75;margin-bottom:6px}
.hero .when{font:800 44px/1 var(--head);letter-spacing:-.02em;margin:0 0 8px}
.hero .what{font:700 20px/1.25 var(--head);margin:0}
.hero .sub{margin:8px 0 0;font-size:15px;opacity:.8}
.hero.calm .when{font-size:30px}

.alerts{display:grid;gap:8px;margin:10px 0 4px}
.alert{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px 12px}
.alert b{font:700 16px var(--head)}
.alert span{display:block;color:var(--muted);font-size:15px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 15px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.item button:focus-visible,summary:focus-visible{outline:3px solid var(--class);outline-offset:2px}

h2{font:700 15px var(--head);color:var(--muted);margin:22px 0 8px;letter-spacing:.01em}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.date{text-align:center;border-right:3px solid var(--c);padding-right:10px;line-height:1.05}
.date b{display:block;font:800 22px var(--head)}
.date i{font-style:normal;font-size:13px;color:var(--muted)}
.title{font-weight:600;line-height:1.3}
.meta{font-size:14px;color:var(--muted);margin-top:2px}
.meta em{font-style:normal;color:var(--c);font-weight:600}
.item button{border:1.5px solid var(--line);background:transparent;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.item.done{opacity:.5}
.item.done .title{text-decoration:line-through}
.item.done button{background:var(--holiday);border-color:var(--holiday);color:#fff}
.item.soft{background:transparent}
.empty{color:var(--muted);padding:8px 2px}
details summary{cursor:pointer;color:var(--muted);font:700 15px var(--head);margin:22px 0 8px}
footer{color:var(--muted);font-size:13px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fall 2026 reminders</h1>
    <p id="today"></p>
  </header>

  <section id="hero"></section>
  <section id="alerts" class="alerts" aria-live="polite"></section>

  <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>

  <div id="out"></div>

  <footer>
    United International University · Fall 2026 Trimester. Tick the circle when you finish something. Ticks are saved on this device only.
  </footer>
</div>

<script>
/* ============================================================
   EDIT HERE EACH TRIMESTER
   Format: [start "YYYY-MM-DD", end "YYYY-MM-DD" or null, type, title, note]
   Types: fee | exam | deadline | class | holiday
   ============================================================ */
const TRIMESTER = "Fall 2026";
const EVENTS = [
  ["2026-10-24","2026-10-26","deadline","Course advising and registration",""],
  ["2026-10-25","2026-10-26","class","Open Day Orientation",""],
  ["2026-10-26",null,"deadline","Last day of advising and registration without fine",""],
  ["2026-10-27",null,"class","Classes begin",""],
  ["2026-10-31",null,"deadline","Last day to drop a course with 100% adjustable refund",""],
  ["2026-11-04",null,"deadline","Last day to apply for Grade Change (Summer 2026 courses)","No application is considered after this date."],
  ["2026-11-05",null,"class","Regular Saturday class (online)","Thursday follows the Saturday schedule."],
  ["2026-11-07",null,"holiday","National Revolution and Solidarity Day",""],
  ["2026-11-08",null,"deadline","Last day of grade submission for Project / Thesis / Internship",""],
  ["2026-11-09",null,"deadline","Last day to drop a course with 50% adjustable refund","Also last day of advising with a Tk. 500 fine, and grade submission for Summer 2026 incomplete grades."],
  ["2026-11-12",null,"class","Regular Saturday class (online)","Thursday follows the Saturday schedule."],
  ["2026-11-22",null,"fee","Last date of 1st installment (40%)","Tk. 500 fine if 40% of tuition and trimester fee is unpaid. Students from ID 252 onwards: Tk. 20,000 at registration, then 40% of the rest."],
  ["2026-11-26",null,"class","Regular Sunday class (online)","Thursday follows the Sunday schedule."],
  ["2026-12-05","2026-12-12","exam","Mid-term exam",""],
  ["2026-12-15",null,"fee","Last date of 2nd installment (70%)","Tk. 500 fine if 70% is unpaid."],
  ["2026-12-16",null,"holiday","Victory Day",""],
  ["2026-12-17",null,"class","Regular Wednesday class (online)","Thursday follows the Wednesday schedule."],
  ["2026-12-23",null,"deadline","Last day of course withdrawal",""],
  ["2026-12-25",null,"holiday","Christmas Day",""],
  ["2026-12-31",null,"class","Regular Saturday class (online)","Thursday follows the Saturday schedule."],
  ["2027-01-13",null,"fee","Last date of 3rd installment (100%)","Tk. 500 fine if full fee is unpaid."],
  ["2027-01-21","2027-01-24","class","Classes suspended",""],
  ["2027-01-24",null,"holiday","Shab-e-Barat","Subject to the appearance of the moon."],
  ["2027-01-25","2027-02-01","exam","Final exam",""],
  ["2027-02-04",null,"deadline","Last day of grade submission (including Self-Study courses)",""],
  ["2027-02-09",null,"class","Spring 2027 classes begin",""]
];
const TYPES = {
  fee:{label:"Fees",color:"var(--fee)"},
  exam:{label:"Exams",color:"var(--exam)"},
  deadline:{label:"Deadlines",color:"var(--deadline)"},
  class:{label:"Classes",color:"var(--class)"},
  holiday:{label:"Holidays",color:"var(--holiday)"}
};
/* ============================================================ */

const TZ = "Asia/Dhaka";
const DAY = 86400000;
const toUTC = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d); };
const todayUTC = () => toUTC(new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(new Date()));
const fmt = (t,opt) => new Intl.DateTimeFormat("en-GB",Object.assign({timeZone:"UTC"},opt)).format(t);

let filter = "all";
let done = {};
try { done = JSON.parse(localStorage.getItem("uiu-done") || "{}"); } catch(e) {}
const saveDone = () => { try { localStorage.setItem("uiu-done", JSON.stringify(done)); } catch(e) {} };

const events = EVENTS.map((e,i) => ({
  id: TRIMESTER + i, s: toUTC(e[0]), e: toUTC(e[1] || e[0]),
  type: e[2], title: e[3], note: e[4], range: !!e[1]
}));

function rel(ev, today){
  if (today >= ev.s && today <= ev.e){
    if (!ev.range) return {n:0, text:"Today", tone:"now"};
    const left = Math.round((ev.e - today)/DAY);
    return {n:0, text: left === 0 ? "Ends today" : "Ongoing, ends in " + left + (left===1?" day":" days"), tone:"now"};
  }
  const d = Math.round((ev.s - today)/DAY);
  if (d === 1) return {n:1, text:"Tomorrow", tone:"soon"};
  if (d > 1) return {n:d, text:"In " + d + " days", tone: d <= 3 ? "soon" : "later"};
  const ago = Math.round((today - ev.e)/DAY);
  return {n:-ago, text: ago === 1 ? "Yesterday" : ago + " days ago", tone:"past"};
}
const dateLabel = ev => ev.range
  ? fmt(ev.s,{day:"numeric",month:"short"}) + " – " + fmt(ev.e,{day:"numeric",month:"short"})
  : fmt(ev.s,{weekday:"long",day:"numeric",month:"short"});

function itemHTML(ev, today, soft){
  const r = rel(ev, today), t = TYPES[ev.type];
  const d = new Date(ev.s);
  return `<div class="item ${done[ev.id]?"done":""} ${soft?"soft":""}" style="--c:${t.color}">
    <div class="date"><b>${d.getUTCDate()}</b><i>${fmt(ev.s,{month:"short"})}</i></div>
    <div><div class="title">${ev.title}</div>
      <div class="meta"><em>${r.text}</em> · ${dateLabel(ev)}${ev.note ? "<br>"+ev.note : ""}</div></div>
    <button data-id="${ev.id}" aria-label="Mark done" aria-pressed="${!!done[ev.id]}">${done[ev.id] ? "✓" : ""}</button>
  </div>`;
}

function render(){
  const today = todayUTC();
  document.getElementById("today").textContent = fmt(today,{weekday:"long",day:"numeric",month:"long",year:"numeric"});

  const open = events.filter(e => !done[e.id]);
  const upcoming = open.filter(e => e.e >= today).sort((a,b) => a.s - b.s);
  const important = upcoming.filter(e => e.type !== "holiday" && e.type !== "class" || e.title.startsWith("Classes begin") || e.title.includes("suspended"));

  /* hero: the most pressing thing right now */
  const focus = upcoming.filter(e => e.type !== "holiday" && !e.title.startsWith("Regular"))[0] || upcoming[0];
  const hero = document.getElementById("hero");
  if (focus){
    const r = rel(focus, today), t = TYPES[focus.type];
    const more = upcoming.filter(e => e !== focus && e.s === focus.s && e.type !== "holiday").length;
    hero.innerHTML = `<div class="hero ${r.n > 7 ? "calm":""}"><small>Next up · ${t.label}</small>
      <p class="when">${r.text}</p><p class="what">${focus.title}</p>
      <p class="sub">${dateLabel(focus)}${more ? " · plus " + more + " more the same day" : ""}</p></div>`;
  } else {
    hero.innerHTML = `<div class="hero calm"><p class="when">All clear</p><p class="sub">Nothing left on this trimester's calendar.</p></div>`;
  }

  /* alerts: anything due today, tomorrow or in the next 3 days, other than the hero */
  const alerts = upcoming.filter(e => e !== focus && rel(e,today).n <= 3 && e.type !== "class");
  document.getElementById("alerts").innerHTML = alerts.map(e => {
    const r = rel(e,today);
    return `<div class="alert" style="--c:${TYPES[e.type].color}"><b>${r.text}: ${e.title}</b><span>${dateLabel(e)}</span></div>`;
  }).join("");

  /* chips */
  document.getElementById("chips").innerHTML =
    [["all","All"]].concat(Object.entries(TYPES).map(([k,v]) => [k,v.label]))
      .map(([k,l]) => `<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("");

  /* lists */
  const match = e => filter === "all" || e.type === filter;
  const all = events.slice().sort((a,b) => a.s - b.s).filter(match);
  const week = all.filter(e => e.e >= today && e.s - today <= 7*DAY);
  const later = all.filter(e => e.s - today > 7*DAY);
  const past = all.filter(e => e.e < today).reverse();

  let html = "";
  html += `<h2>This week</h2><div class="list">${week.length ? week.map(e => itemHTML(e,today)).join("") : '<div class="empty">Nothing in the next 7 days.</div>'}</div>`;
  if (later.length) html += `<h2>Coming later</h2><div class="list">${later.map(e => itemHTML(e,today)).join("")}</div>`;
  if (past.length) html += `<details><summary>Already passed (${past.length})</summary><div class="list">${past.map(e => itemHTML(e,today,true)).join("")}</div></details>`;
  document.getElementById("out").innerHTML = html;
}

document.addEventListener("click", ev => {
  const chip = ev.target.closest(".chip");
  if (chip){ filter = chip.dataset.f; render(); return; }
  const btn = ev.target.closest(".item button");
  if (btn){ const id = btn.dataset.id; done[id] ? delete done[id] : done[id] = true; saveDone(); render(); }
});
/* refresh whenever the tab comes back into view, so the date is always current */
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
render();
</script>
</body>
</html>
